<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Vuejs Componentes Reutilizávies</title>
</head>

<body>

    <section>

        <div id="app">

            <h1>{{titulo}}</h1>
            <menu-bar>Item 1</menu-bar>
            <menu-bar>Item 2</menu-bar>
            <menu-bar>Item 3</menu-bar>

            <template id="menu">
                <ul>
                    <li>Item 1</li>
                    <li>Item 2</li>
                    <li>Item 3
                    </li>
                </ul>
            </template>

        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.14/dist/vue.js"></script>
    <script>

        Vue.component('menu-bar', {
            template: '#menu',
        })
        new Vue({
            el: "#app",
            data: {
                titulo: "Vue JS",
            }
        });


    </script>

</body>

</html>
