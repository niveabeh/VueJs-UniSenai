<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Vue em Formulario</title>
    <style>

        .red{
            color: red;
        }
        .green{
            color: green;
        }
        .blue{
            color: blue;
        }
    </style>
</head>

<body>

    <section>

        <div id="app">
            <h1> {{titulo}} </h1>
            <img v-bind:src="imagem" alt="">
            <p :class="classe"> Lorem ipsum dolor sit amet consectetur adipisicing elit. Natus reiciendis facilis odio dolor commodi saepe. Quod laboriosam necessitatibus, voluptatibus repellat ipsa aliquam quam quas exercitationem aut animi sint qui voluptatem!</p>
        </div>
    </section>

      <script src="https://cdn.jsdelivr.net/npm/vue@2.7.14/dist/vue.js"></script>
      <script>

        const app = new Vue({
            el: "#app",
            data: {
                titulo: "Formulário com Vue.js",
                classe: "green",
                Imagem: "img/casas.jpg"
            } 
        })
      </script>

</body>

</html>
