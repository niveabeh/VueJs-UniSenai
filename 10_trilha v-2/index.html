<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Vuejs Componentes Reutilizávies</title>
</head>

<body>

    <section>

        <div id="app">

            <btn-reutilizavel cor="green" @clicando="clique" texto="Clique aqui" ></btn-reutilizavel>
            <btn-reutilizavel cor="blue" texto="Enviar"></btn-reutilizavel>
            <btn-reutilizavel cor="red" texto="Cancelar"></btn-reutilizavel >

        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.14/dist/vue.js"></script>
    <script>

        Vue.component('btn-reutilizavel', {
            //falo que vou querer que o texto, a cor e o evento vão ser dinamicos
            props: ["texto", "cor", "evento"], 
            //ali em click= evento > falo onde o valor de evento vai se encaixar 
            template: '<button @click=" evento " class="btn1" :style="{ backgroundColor: cor} ">{{texto}}</button>',
            methods:{
                //falo o que o valor do evento vai fazer
                evento(){
                    //crio um evento meu chamdo clicando
                    this.$emit("clicando");
                }
            }
        })
        new Vue({
            el: "#app",
            methods:{
                //e crio um metodo clique 
               clique(){
                alert("O botão foi clicado");
               }
            }

        })


    </script>

</body>

</html>
